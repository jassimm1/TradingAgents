services:
  - type: web
    name: tradingagents-phone
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.web
    healthCheckPath: /health
    envVars:
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TRADINGAGENTS_LLM_PROVIDER
        value: groq
      - key: TRADINGAGENTS_QUICK_THINK_LLM
        value: openai/gpt-oss-20b
      - key: TRADINGAGENTS_DEEP_THINK_LLM
        value: openai/gpt-oss-20b
